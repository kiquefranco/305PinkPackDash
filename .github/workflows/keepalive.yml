# Supabase pauses free projects after 7 days without database activity.
# This job touches the database every 3 days so the dashboard never goes to sleep.
# Setup: repo Settings > Secrets and variables > Actions > add SUPABASE_URL and SUPABASE_KEY.

name: Keep Supabase awake

on:
  schedule:
    - cron: '17 13 */3 * *'   # every 3 days, 9:17 AM Eastern (13:17 UTC)
  workflow_dispatch:           # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Add SUPABASE_URL and SUPABASE_KEY as repository secrets." && exit 1
          fi
          curl --fail --silent --show-error -X POST \
            "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
          echo "Database is awake."
